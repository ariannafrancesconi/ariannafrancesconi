<title id="rt">Where my work sits in Resilient AI</title>
<desc id="rd">Four overlapping challenges of resilient clinical AI: imbalance, bias and fairness, domain shift, missing modalities. Projects sit in their intersections, linked by a travelling spark to the core, where the ADELAI clinical study meets all four at once.</desc>
