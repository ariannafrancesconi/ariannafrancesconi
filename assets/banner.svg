<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Arianna Francesconi, PhD candidate in AI</title>
  <desc id="d">Cover banner: Resilient Multimodal AI for Healthcare. As real-world data drift from training conditions, a brittle model loses a large step at each of four challenges (imbalance, bias, domain shift, missing data) while a resilient one degrades gracefully.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061526"/>
      <stop offset="0.55" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#0E3A55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#1E4E6E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A2540" stop-opacity="0.2"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <!-- faint voice waveform along the bottom -->
  <path d="M0 300 C40 288 60 312 100 300 S160 284 200 300 S260 318 300 300 S360 286 400 300 S460 314 500 300 S560 290 600 300 S660 310 700 300"
        fill="none" stroke="#2DD4BF" stroke-opacity="0.18" stroke-width="2"/>

  <!-- LEFT: identity -->
  <g class="sans">
    <text x="72" y="96" fill="#7FE7D8" font-size="15" font-weight="600" letter-spacing="3">PHD CANDIDATE · ARTIFICIAL INTELLIGENCE</text>
    <text x="70" y="160" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Arianna Francesconi</text>
    <text x="72" y="202" fill="#CFE3F1" font-size="23" font-weight="400">Resilient multimodal AI for healthcare</text>
    <text x="72" y="232" fill="#8FB1C9" font-size="17">turning messy, real-world clinical data into decisions you can trust</text>
  </g>

  <!-- pills -->
  <g class="sans" font-size="14" font-weight="600">
    <rect x="72" y="258" width="256" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="200" y="279" fill="#E6F1F8" text-anchor="middle">Università Campus Bio-Medico</text>
    <rect x="340" y="258" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="382" y="279" fill="#E6F1F8" text-anchor="middle">EPFL</text>
  </g>

  <!-- RIGHT: the idea of resilience. As data drift from training conditions,
       a brittle model loses a large step at each of four challenges (imbalance, bias, domain shift, missing data) while a resilient one degrades gracefully. -->
  <g transform="translate(820 38)">
    <rect x="0" y="0" width="420" height="262" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <!-- axes -->
    <line x1="44" y1="206" x2="396" y2="206" stroke="#8FB1C9" stroke-opacity="0.6" stroke-width="1.4"/>
    <line x1="44" y1="206" x2="44" y2="34" stroke="#8FB1C9" stroke-opacity="0.6" stroke-width="1.4"/>
    <path d="M396 206l-7 -4v8z M44 34l-4 7h8z" fill="#8FB1C9" fill-opacity="0.6"/>
    <text class="sans" x="30" y="120" fill="#8FB1C9" font-size="12" text-anchor="middle" transform="rotate(-90 30 120)">performance</text>
    <text class="mono" x="396" y="246" fill="#8FB1C9" font-size="11.5" text-anchor="end">real-world data drift from training →</text>

    <!-- the four challenges, met one after another as data drift away from training -->
    <g stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.75">
      <line x1="96"  y1="44" x2="96"  y2="202" stroke="#14B8A6"/>
      <line x1="180" y1="44" x2="180" y2="202" stroke="#F43F5E"/>
      <line x1="262" y1="44" x2="262" y2="202" stroke="#F59E0B"/>
      <line x1="344" y1="44" x2="344" y2="202" stroke="#A78BFA"/>
    </g>
    <g class="mono" font-size="10" fill-opacity="0.9" text-anchor="middle">
      <rect x="92"  y="202" width="8" height="8" rx="4" fill="#14B8A6"/><text x="96"  y="224" fill="#5EEAD4">imbalance</text>
      <rect x="176" y="202" width="8" height="8" rx="4" fill="#F43F5E"/><text x="180" y="224" fill="#FDA4AF">bias</text>
      <rect x="258" y="202" width="8" height="8" rx="4" fill="#F59E0B"/><text x="262" y="224" fill="#FCD34D">domain shift</text>
      <rect x="340" y="202" width="8" height="8" rx="4" fill="#A78BFA"/><text x="344" y="224" fill="#C4B5FD">missing data</text>
    </g>

    <!-- brittle model: loses a large step at every challenge -->
    <path id="brittle" d="M46 60 L80 60 C92 60 100 98 112 98 L164 98 C176 98 184 136 196 136 L246 136 C258 136 266 170 278 170 L328 170 C340 170 348 196 360 196 L392 197"
          fill="none" stroke="#8B949E" stroke-width="2.5" stroke-dasharray="600" stroke-dashoffset="600" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.35;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <text class="sans" x="392" y="186" fill="#8B949E" font-size="13" font-weight="600" text-anchor="end">brittle
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.38;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <!-- resilient model -->
    <path id="resil" d="M46 56 L80 56 C92 56 100 62 112 62 L164 62 C176 62 184 69 196 69 L246 69 C258 69 266 77 278 77 L328 77 C340 77 348 86 360 86 L392 87"
          fill="none" stroke="#2DD4BF" stroke-width="4" stroke-dasharray="420" stroke-dashoffset="420" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="420;420;0;0;420" keyTimes="0;0.15;0.5;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle r="7" fill="#FFFFFF" opacity="0">
      <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1;1" keyTimes="0;0.15;0.5;0.9;1" calcMode="linear">
        <mpath href="#resil"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.16;0.9;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="392" y="68" text-anchor="end" fill="#7FE7D8" font-size="14" font-weight="700">resilient
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.52;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
